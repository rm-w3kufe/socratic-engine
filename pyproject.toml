[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socratic-engine"
version = "0.1.0"
description = "Externalized epistemic scaffolding for AI agents. Recursive boolean certification trees."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["socratic", "epistemic", "verification", "certification", "boolean-trees", "trivalent-logic", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
socratic-engine = "socratic_engine.cli:main"
socratic-engine-mcp = "socratic_engine.mcp_server:main"

[tool.setuptools]
packages = ["socratic_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]