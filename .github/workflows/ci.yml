name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (core)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          python -m pytest tests/ -q --cov=socratic_engine --cov-report=term-missing --cov-fail-under=50
      - name: CLI smoke test (eval-tree contract — R10 external contract)
        run: |
          printf 'socratic("SMOKE") = {\n  predicate: "ctx_has",\n  args: ["$ctx", "type"],\n  home: "ok",\n}\n' > /tmp/smoke.vsm
          python -m socratic_engine.cli eval-tree /tmp/smoke.vsm --doc-type test --context '{"type":"test"}' | python -c "import sys,json; d=json.load(sys.stdin); assert d['truth']=='TRUE', d; print('CLI OK:', d['truth'])"

  mcp:
    name: MCP server import (optional dep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with MCP extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]"
      - name: MCP server imports and entrypoint exists
        run: |
          python -c "from socratic_engine.mcp_server import main; print('MCP import OK')"
          python -c "import importlib.metadata as m; eps=[e for e in m.entry_points(group='console_scripts') if 'socratic' in e.name]; print('scripts:', [e.name for e in eps])"